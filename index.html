<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poop Counter">
<meta name="theme-color" content="#EDE7DB">
<title>Poop Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper: #EDE7DB;
    --paper-dark: #1C1B18;
    --ink: #2B2620;
    --ink-dark: #E9E3D6;
    --clay: #A6512F;
    --clay-soft: #C97A52;
    --line: #B9AF9B;
    --line-dark: #4A453B;
    --ok: #4C6B4F;
    --card: #F6F2E8;
    --card-dark: #24221D;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: var(--paper-dark);
      --fg: var(--ink-dark);
      --line: var(--line-dark);
      --card: var(--card-dark);
    }
  }
  :root{ --bg: var(--paper); --fg: var(--ink); }
  :root[data-theme="dark"]{
    --bg: var(--paper-dark);
    --fg: var(--ink-dark);
    --line: var(--line-dark);
    --card: var(--card-dark);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Space Mono', ui-monospace, monospace;
    min-height:100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    display:flex;
    justify-content:center;
  }
  .sheet{
    width:100%;
    max-width:460px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-size:28px;
    font-weight:500;
    margin:0;
    letter-spacing:-0.01em;
  }
  .count{
    font-size:12px;
    opacity:0.6;
    white-space:nowrap;
  }

  .field{
    margin-bottom:18px;
  }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:0.02em;
    opacity:0.65;
    margin-bottom:6px;
  }
  input[type="date"],
  input[type="time"],
  input[type="number"],
  input[type="text"],
  select{
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:12px 12px;
    font-family:inherit;
    font-size:16px;
    color:var(--fg);
    -webkit-appearance:none;
    appearance:none;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--clay);
  }

  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .toggle-field label{margin-bottom:8px;}
  .toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
  }
  .toggle button{
    flex:1;
    padding:11px 8px;
    background:var(--card);
    color:var(--fg);
    border:none;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    opacity:0.55;
    border-right:1px solid var(--line);
  }
  .toggle button:last-child{border-right:none;}
  .toggle button.active{
    opacity:1;
    background:var(--clay);
    color:#F6F0E4;
  }

  .submit{
    width:100%;
    padding:15px;
    margin-top:6px;
    background:var(--line);
    color:var(--bg);
    border:none;
    border-radius:2px;
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:500;
    cursor:pointer;
    opacity:0.55;
    transition: background 0.2s, opacity 0.2s;
  }
  .submit.ready{
    background:var(--clay);
    color:#F6F0E4;
    opacity:1;
  }
  .submit:active{ transform: scale(0.99); }

  .saved-flash{
    text-align:center;
    font-size:12px;
    color:var(--ok);
    margin-top:10px;
    height:14px;
    opacity:0;
    transition:opacity 0.25s;
  }
  .saved-flash.show{ opacity:1; }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:32px 0 18px;
    opacity:0.5;
  }
  .divider .l{flex:1; height:1px; background:var(--line);}
  .divider span{font-size:11px; letter-spacing:0.02em;}

  .entries{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:24px;
  }
  .entry{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:10px 12px;
    font-size:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .entry .meta{opacity:0.7;}
  .entry .tags{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .entry .tag{
    border:1px solid var(--line);
    border-radius:2px;
    padding:2px 6px;
    font-size:10px;
    opacity:0.75;
  }
  .entry .tag.on{
    background:var(--clay);
    border-color:var(--clay);
    color:#F6F0E4;
    opacity:1;
  }
  .entry button{
    background:none;
    border:none;
    color:var(--fg);
    opacity:0.35;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    padding:0 2px;
  }
  .empty{
    text-align:center;
    font-size:12px;
    opacity:0.5;
    padding:20px 0;
  }

  .export{
    width:100%;
    padding:14px;
    background:transparent;
    color:var(--fg);
    border:1px solid var(--line);
    border-radius:2px;
    font-family:'Space Mono', monospace;
    font-size:13px;
    cursor:pointer;
    margin-bottom:10px;
  }
  .export:active{ border-color:var(--clay); }

  .wipe{
    width:100%;
    text-align:center;
    background:none;
    border:none;
    color:var(--fg);
    opacity:0.4;
    font-family:inherit;
    font-size:11px;
    padding:8px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="sheet">

  <header>
    <h1>Poop Counter</h1>
    <div class="count" id="count">0 registros</div>
  </header>

  <form id="form">
    <div class="row2">
      <div class="field">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>
      </div>
      <div class="field">
        <label for="hora">Hora</label>
        <input type="time" id="hora" required>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="duracion">Duración (min)</label>
        <input type="number" id="duracion" min="0" step="1" inputmode="numeric" placeholder="0">
      </div>
      <div class="field">
        <label for="papel">Cuadros de papel</label>
        <input type="number" id="papel" min="0" step="1" inputmode="numeric" placeholder="0">
      </div>
    </div>

    <div class="field">
      <label for="sitio">Sitio</label>
      <input type="text" id="sitio" list="sitioList" autocomplete="off" placeholder="Casa, trabajo...">
      <datalist id="sitioList"></datalist>
    </div>

    <div class="field toggle-field">
      <label>¿Perfect?</label>
      <div class="toggle" data-field="perfect">
        <button type="button" data-val="1">Sí</button>
        <button type="button" data-val="0" class="active">No</button>
      </div>
    </div>

    <div class="field toggle-field">
      <label>¿Por lactosa?</label>
      <div class="toggle" data-field="lactosa">
        <button type="button" data-val="1">Sí</button>
        <button type="button" data-val="0" class="active">No</button>
      </div>
    </div>

    <div class="field toggle-field">
      <label>¿Te has masturbado?</label>
      <div class="toggle" data-field="masturbacion">
        <button type="button" data-val="1">Sí</button>
        <button type="button" data-val="0" class="active">No</button>
      </div>
    </div>

    <button type="submit" class="submit" id="submitBtn">Guardar registro</button>
    <div class="saved-flash" id="flash">Guardado</div>
  </form>

  <div class="divider"><div class="l"></div><span>ÚLTIMOS REGISTROS</span><div class="l"></div></div>

  <div class="entries" id="entries"></div>

  <div class="divider"><div class="l"></div><span>DATOS</span><div class="l"></div></div>

  <button class="export" id="exportBtn">Descargar Excel (.xlsx)</button>
  <button class="wipe" id="wipeBtn">Borrar todos los registros</button>

</div>

<script>
const STORE_KEY = 'bitacora_entries_v1';
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwtGoFmCs_ItXVMwD99lgtulMZd5T6PRHSivKoqJWucTdXtzA-BrKCZJx61cVWA4Mqbhw/exec';

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}
function saveEntries(entries){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(entries));
  }catch(e){
    alert('No se pudo guardar el registro en este dispositivo.');
  }
}

let entries = loadEntries();

const form = document.getElementById('form');
const fechaInput = document.getElementById('fecha');
const horaInput = document.getElementById('hora');
const countEl = document.getElementById('count');
const entriesEl = document.getElementById('entries');
const flash = document.getElementById('flash');

const toggles = {};
document.querySelectorAll('.toggle').forEach(t => {
  const field = t.dataset.field;
  toggles[field] = 0;
  t.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      t.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      toggles[field] = parseInt(btn.dataset.val, 10);
    });
  });
});

const sitioList = document.getElementById('sitioList');
const submitBtn = document.getElementById('submitBtn');
const duracionInput = document.getElementById('duracion');
const papelInput = document.getElementById('papel');
const sitioInput = document.getElementById('sitio');

function checkComplete(){
  const complete = fechaInput.value.trim() &&
                    horaInput.value.trim() &&
                    duracionInput.value.trim() !== '' &&
                    papelInput.value.trim() !== '' &&
                    sitioInput.value.trim() !== '';
  submitBtn.classList.toggle('ready', !!complete);
}
[fechaInput, horaInput, duracionInput, papelInput, sitioInput].forEach(el => {
  el.addEventListener('input', checkComplete);
  el.addEventListener('change', checkComplete);
});

function updateSitioSuggestions(){
  const counts = {};
  entries.forEach(e => {
    const s = (e.sitio || '').trim();
    if(!s) return;
    counts[s] = (counts[s] || 0) + 1;
  });
  const sorted = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
  sitioList.innerHTML = sorted.map(s => `<option value="${s.replace(/"/g,'&quot;')}"></option>`).join('');
}

function setNow(){
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  fechaInput.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  horaInput.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
}
setNow();

function render(){
  countEl.textContent = entries.length === 1 ? '1 registro' : `${entries.length} registros`;

  if(entries.length === 0){
    entriesEl.innerHTML = '<div class="empty">Aún no hay registros</div>';
    return;
  }

  const sorted = [...entries].sort((a,b) => (b.fecha+b.hora).localeCompare(a.fecha+a.hora));
  entriesEl.innerHTML = sorted.slice(0, 8).map(e => {
    const [y,m,d] = e.fecha.split('-');
    const tags = [];
    if(e.perfect) tags.push('<span class="tag on">perfect</span>');
    if(e.lactosa) tags.push('<span class="tag on">lactosa</span>');
    if(e.masturbacion) tags.push('<span class="tag on">+</span>');
    if(!tags.length) tags.push('<span class="tag">—</span>');
    return `<div class="entry">
      <div class="meta">${d}/${m} ${e.hora} · ${e.sitio}${e.duracion ? ' · '+e.duracion+'min' : ''}</div>
      <div class="tags">${tags.join('')}<button onclick="removeEntry('${e.id}')" aria-label="Eliminar">✕</button></div>
    </div>`;
  }).join('');
}

window.removeEntry = function(id){
  entries = entries.filter(e => e.id !== id);
  saveEntries(entries);
  render();
  updateSitioSuggestions();
};

function sendToSheet(entry){
  fetch(SHEET_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(entry)
  }).catch(() => {
    // Sin conexión o fallo de red: el registro ya está a salvo en local,
    // se podrá reintentar el envío más adelante si hace falta.
  });
}

form.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    fecha: fechaInput.value,
    hora: horaInput.value,
    duracion: document.getElementById('duracion').value ? parseInt(document.getElementById('duracion').value, 10) : null,
    papel: document.getElementById('papel').value ? parseInt(document.getElementById('papel').value, 10) : null,
    sitio: document.getElementById('sitio').value,
    perfect: toggles.perfect,
    lactosa: toggles.lactosa,
    masturbacion: toggles.masturbacion
  };
  entries.push(entry);
  saveEntries(entries);
  sendToSheet(entry);
  render();

  // reset toggles to "No", reset time to now, keep sitio selection
  document.querySelectorAll('.toggle').forEach(t => {
    t.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    t.querySelector('button[data-val="0"]').classList.add('active');
    toggles[t.dataset.field] = 0;
  });
  document.getElementById('duracion').value = '';
  document.getElementById('papel').value = '';
  setNow();
  updateSitioSuggestions();
  checkComplete();

  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 1200);
});

document.getElementById('exportBtn').addEventListener('click', () => {
  if(entries.length === 0){
    alert('No hay registros que exportar todavía.');
    return;
  }
  const rows = [...entries]
    .sort((a,b) => (a.fecha+a.hora).localeCompare(b.fecha+b.hora))
    .map(e => ({
      'Fecha': e.fecha,
      'Hora': e.hora,
      'Duración (min)': e.duracion ?? '',
      'Sitio': e.sitio,
      'Cuadros de papel': e.papel ?? '',
      'Perfect': e.perfect ? 'Sí' : 'No',
      'Lactosa': e.lactosa ? 'Sí' : 'No',
      'Masturbación': e.masturbacion ? 'Sí' : 'No'
    }));

  try{
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:11},{wch:7},{wch:14},{wch:12},{wch:16},{wch:9},{wch:9},{wch:13}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Registros');
    const today = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `bitacora_${today}.xlsx`);
  }catch(e){
    alert('No se pudo generar el archivo Excel.');
  }
});

document.getElementById('wipeBtn').addEventListener('click', () => {
  if(entries.length === 0) return;
  if(confirm('¿Seguro que quieres borrar todos los registros? Esto no se puede deshacer.')){
    entries = [];
    saveEntries(entries);
    render();
  }
});

render();
updateSitioSuggestions();
checkComplete();
</script>
</body>
</html>
